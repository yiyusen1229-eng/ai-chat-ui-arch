  <!-- ===== 浮层界面(直接属于舞台) ===== -->

    <div class="saveSlot slot1" data-slot="1"></div><div class="saveSlot slot2" data-slot="2"></div><div class="saveSlot slot3" data-slot="3"></div><div class="saveSlot slot4" data-slot="4"></div><div class="saveSlot slot5" data-slot="5"></div><div class="saveSlot slot6" data-slot="6"></div><div class="saveSlot slot7" data-slot="7"></div><div class="saveSlot slot8" data-slot="8"></div><div class="saveSlot slot9" data-slot="9"></div><div class="saveSlot slot10" data-slot="10"></div>
    <div class="pagerL" id="pagerPrev"><img class="s1" src="assets/ui/save/pager_l1.png" alt=""><img class="s2" src="assets/ui/save/pager_l2.png" alt=""><img class="s3" src="assets/ui/save/pager_l3.png" alt=""></div>
    <div class="pagerBar"><img id="pagerBanner" src="assets/ui/save/banner_load.png" alt=""></div>
    <div class="pagerR" id="pagerNext"><img class="s1" src="assets/ui/save/pager_r1.png" alt=""><img class="s2" src="assets/ui/save/pager_r2.png" alt=""><img class="s3" src="assets/ui/save/pager_r3.png" alt=""></div>

      <div class="btn no" id="dlgNo"><img class="s1" src="assets/ui/save/btn_no1.png" alt=""><img class="s2" src="assets/ui/save/btn_no2.png" alt=""><img class="s3" src="assets/ui/save/btn_no3.png" alt=""></div>
    </div>
    <div class="uiFoot"><img src="assets/ui/sys_09000.png" alt=""></div>
    <div class="uiExit" role="button" title="返回"><img class="s1" src="assets/ui/save/exit_0.png" alt=""><img class="s2" src="assets/ui/save/exit_1.png" alt=""><img class="s3" src="assets/ui/save/exit_2.png" alt=""></div>
  </div>

  <!-- ===== 设置 ===== -->

  <!-- ===== 系统设置 ===== -->
  <div id="optScreen" class="uiScreen">

    <div class="optHead"><img src="assets/ui/opt/topbar.png" alt=""></div>

    <div class="optTab" id="optT1"><img src="assets/ui/opt/tab1_on.png" alt=""></div>
    <div class="optTab" id="optT2"><img src="assets/ui/opt/tab2_off.png" alt=""></div>
    <div class="optTab" id="optT3"><img src="assets/ui/opt/tab3_off.png" alt=""></div>
    <div class="optPage"><img src="assets/ui/opt/page.png" alt=""></div>
    <div class="optContent" id="optContent"><img class="optLayer ctBase" src="assets/ui/opt/opt1_base.png" alt=""></div>
    <div class="optContent" id="optContent2"><img class="optLayer ctBase" src="assets/ui/opt/opt2_base.png" alt=""></div>
    <div class="optContent optContent3" id="optContent3"><div class="o3sec o3sec1"><div class="o3title"><img src="assets/ui/text/mgr_chat.png" alt=""></div><div class="o3row"><span class="o3label"><img src="assets/ui/text/mgr_endpoint.png" alt=""></span><span class="o3field" data-k=""><input class="o3input" type="text" data-k="chat.endpoint" placeholder="https://..."><img class="o3val" alt=""></span></div><div class="o3row"><span class="o3label"><img src="assets/ui/text/mgr_apikey.png" alt=""></span><span class="o3field" data-k=""><input class="o3input" type="text" data-k="chat.key" placeholder="sk-..."><img class="o3val" alt=""></span></div><div class="o3row"><span class="o3label"><img src="assets/ui/text/mgr_model.png" alt=""></span><span class="o3field" data-k="chat.model"><span class="o3plain" data-no-uitext="1"></span></span></div></div><div class="o3sec o3sec2"><div class="o3title"><img src="assets/ui/text/mgr_voice.png" alt=""></div><div class="o3row"><span class="o3label">端点</span><span class="o3field" data-k=""><input class="o3input" type="text" data-k="voice.endpoint" placeholder="https://..."><img class="o3val" alt=""></span></div><div class="o3row"><span class="o3label">API 密钥</span><span class="o3field" data-k=""><input class="o3input" type="text" data-k="voice.key" placeholder="sk-..."><img class="o3val" alt=""></span></div><div class="o3row"><span class="o3label">模型名称</span><span class="o3field" data-k="voice.model"><span class="o3plain" data-no-uitext="1"></span></span></div></div><div class="o3sec o3sec3"><div class="o3title"><img src="assets/ui/text/mgr_mt.png" alt=""></div><div class="o3row"><span class="o3label">端点</span><span class="o3field" data-k=""><input class="o3input" type="text" data-k="mt.endpoint" placeholder="https://..."><img class="o3val" alt=""></span></div><div class="o3row"><span class="o3label">API 密钥</span><span class="o3field" data-k=""><input class="o3input" type="text" data-k="mt.key" placeholder="sk-..."><img class="o3val" alt=""></span></div><div class="o3row"><span class="o3label">模型名称</span><span class="o3field" data-k="mt.model"><span class="o3plain" data-no-uitext="1"></span></span></div></div></div><div class="optPagerText"><img src="assets/ui/opt/pager_text.png" alt=""></div>
    <div class="optPagerBtn" id="optPrev"><img src="assets/ui/opt/pager_l1.png" alt=""></div>
    <div class="optPagerBtn" id="optNext"><img src="assets/ui/opt/pager_r1.png" alt=""></div>
        <div class="optFoot"><img src="assets/ui/opt/footbar.png" alt=""></div>
<div class="uiExit" role="button" title="返回"><img class="s1" src="assets/ui/save/exit_0.png" alt=""><img class="s2" src="assets/ui/save/exit_1.png" alt=""><img class="s3" src="assets/ui/save/exit_2.png" alt=""></div>
  </div>

  <!-- ===== 特别模式 =====
       外框与存读档、回想一致；内容是两栏（样式见 special.css，逻辑见 special.js）。
       标签交给 uitext.js 转字模；滑条的百分比/ token 读数由 special.js 用同一个接口实时渲染。 -->
  <div id="specialScreen" class="uiScreen">
    <div class="uiHead"><img src="assets/ui/sys_05000.png" alt=""></div>
    <img class="uiLogo" src="assets/ui_logo.png" alt="">

    <!-- 左栏：上下文 / 记忆书限制 -->
    <div class="spCol spLeft">
      <div class="spTitle"><img src="assets/ui/text/sp_title_save.png" alt=""></div>
      <div class="spReset" id="spReset" role="button" title="恢复默认设置"></div>

      <div class="spSet" data-k="ctx">
        <div class="spLine"><span class="spLabel"><img src="assets/ui/text/sp_ctx.png" alt=""></span><span class="spVal" id="spv-ctx"></span></div>
        <div class="spSlider" id="sps-ctx" data-k="ctx"><span class="spTrack"></span><span class="spKnob"></span></div>
      </div>

      <div class="spSet" data-k="trigger">
        <div class="spLine"><span class="spLabel"><img src="assets/ui/text/sp_trigger.png" alt=""></span><span class="spVal" id="spv-trigger"></span></div>
        <div class="spSlider" id="sps-trigger" data-k="trigger"><span class="spTrack"></span><span class="spKnob"></span></div>
      </div>

      <div class="spSet" data-k="recent">
        <div class="spLine"><span class="spLabel"><img src="assets/ui/text/sp_recent.png" alt=""></span><span class="spVal" id="spv-recent"></span></div>
        <div class="spSlider" id="sps-recent" data-k="recent"><span class="spTrack"></span><span class="spKnob"></span></div>
      </div>

      <div class="spSet" data-k="entries">
        <div class="spLine"><span class="spLabel"><img src="assets/ui/text/sp_entries.png" alt=""></span><span class="spVal" id="spv-entries"></span></div>
        <div class="spSlider" id="sps-entries" data-k="entries"><span class="spTrack"></span><span class="spKnob"></span></div>
      </div>

      <div class="spTitle"><img src="assets/ui/text/sp_title_consume.png" alt=""></div>
      <div class="spLine spStat"><span class="spLabel spTurnLabel"><img src="assets/ui/text/sp_turn_pre.png" alt=""><img class="spTok" src="assets/ui/text/cost_token.png" alt=""><img src="assets/ui/text/sp_turn_post.png" alt=""></span><span class="spVal" id="spv-turn"></span></div>
      <div class="spLine spStat"><span class="spLabel"><img src="assets/ui/text/sp_cost_label.png" alt=""></span><span class="spVal" id="spv-cost"></span></div>
    </div>

    <!-- 右栏：角色配置（底框就是每一项的底，文字压在框上） -->
    <div class="spCol spRight">
      <div class="spTitleRow">
        <div class="spTitle"><img src="assets/ui/text/sp_title_char.png" alt=""></div>
        <div class="spRoleBtns">
          <button class="spRoleBtn" id="spSwitch" type="button" title="从总角色资源文件夹里选一个角色"><img src="assets/ui/text/sp_btn_switch.png" alt=""></button>
          <button class="spRoleBtn" id="spNew" type="button" title="在总角色资源文件夹里新建一个角色"><img src="assets/ui/text/sp_btn_new.png" alt=""></button>
          <button class="spRoleBtn" id="spExport" type="button" title="把角色打包成 zip（提示词 / 世界书 / 记忆书 / 立绘 / 语音）">导出</button>
          <button class="spRoleBtn" id="spImport" type="button" title="从 zip 角色包导入一个新角色">导入</button>
        </div>
      </div>

      <div class="spLine"><span class="spLabel"><img src="assets/ui/text/sp_name_label.png" alt=""></span></div>
      <div class="spNameRow">
        <span class="spNameView" id="spNameView" title="点击修改"></span>
        <input class="spInput" id="spName" type="text" maxlength="12" autocomplete="off" style="display:none">
        <button class="spSave" id="spSave" type="button"><img src="assets/ui/text/sp_save_btn.png" alt=""></button>
      </div>
      <div class="spSaved" id="spSaved"></div>

      <!-- 配置项：点框头展开下拉面板（导入文件 / 查看文件），面板由 special.js 生成 -->
      <div class="spItem" data-item="portrait">
        <div class="spHead" role="button" tabindex="0" aria-expanded="false">
          <span class="spFrame"><span class="spFrameBase"></span><span class="spFrameHover"></span></span>
          <img class="spArrow" src="assets/ui/special/item_arrow.png" alt="">
          <span class="spItemLabel"><img src="assets/ui/text/sp_item_portrait.png" alt=""></span>
        </div>
      </div>
      <div class="spItem" data-item="prompt">
        <div class="spHead" role="button" tabindex="0" aria-expanded="false">
          <span class="spFrame"><span class="spFrameBase"></span><span class="spFrameHover"></span></span>
          <img class="spArrow" src="assets/ui/special/item_arrow.png" alt="">
          <span class="spItemLabel"><img src="assets/ui/text/sp_item_prompt.png" alt=""></span>
        </div>
      </div>
      <div class="spItem" data-item="worldbook">
        <div class="spHead" role="button" tabindex="0" aria-expanded="false">
          <span class="spFrame"><span class="spFrameBase"></span><span class="spFrameHover"></span></span>
          <img class="spArrow" src="assets/ui/special/item_arrow.png" alt="">
          <span class="spItemLabel"><img src="assets/ui/text/sp_item_world.png" alt=""></span>
        </div>
      </div>
      <div class="spItem" data-item="memory">
        <div class="spHead" role="button" tabindex="0" aria-expanded="false">
          <span class="spFrame"><span class="spFrameBase"></span><span class="spFrameHover"></span></span>
          <img class="spArrow" src="assets/ui/special/item_arrow.png" alt="">
          <span class="spItemLabel"><img src="assets/ui/text/sp_item_memory.png" alt=""></span>
        </div>
      </div>
      <div class="spItem" data-item="voice">
        <div class="spHead" role="button" tabindex="0" aria-expanded="false">
          <span class="spFrame"><span class="spFrameBase"></span><span class="spFrameHover"></span></span>
          <img class="spArrow" src="assets/ui/special/item_arrow.png" alt="">
          <span class="spItemLabel"><img src="assets/ui/text/sp_item_voice.png" alt=""></span>
        </div>
      </div>
      <div class="spItem" data-item="model">
        <div class="spHead" role="button" tabindex="0" aria-expanded="false">
          <span class="spFrame"><span class="spFrameBase"></span><span class="spFrameHover"></span></span>
          <img class="spArrow" src="assets/ui/special/item_arrow.png" alt="">
          <span class="spItemLabel"><img src="assets/ui/text/sp_item_model.png" alt=""></span>
        </div>
      </div>
    </div>

    <!-- 角色切换：直接列出现有角色，一键切换（标题在框外，列表可滚动） -->
    <div id="spCharPick" class="spCharPick" data-no-uitext="1" role="dialog" aria-hidden="true">
      <div class="spcpWrap">
        <img class="spcpTitle" id="spcpTitleImg" src="assets/ui/text/sp_switch_title.png" alt="切换角色">
        <span class="spcpTitle spcpTitleText" id="spcpTitleText" style="display:none"></span>
        <div class="spcpBox">
          <div id="spcpList" class="spcpList"></div>
        </div>
        <button id="spcpCancel" class="spcpCancel" type="button"><img src="assets/ui/text/sp_cancel.png" alt="取消"></button>
      </div>
    </div>


    <!-- 角色模型：聊天模型 / 语音模型 的连接设置（底板 sys_00100，输入框 sys_00110） -->
    <div id="spModelDlg" class="spModelDlg" data-no-uitext="1" role="dialog" aria-hidden="true">
      <div class="spmdWrap">
        <div class="spmdTitle"><img id="spmdTitleImg" src="assets/ui/text/mgr_dialog.png" alt=""><span id="spmdKindText"></span></div>
        <div class="spmdRow">
          <span class="spmdLabel"><img src="assets/ui/text/mgr_endpoint.png" alt="端点"></span>
          <span class="spmdField"><span class="spmdFieldBg"></span><input id="spmdEndpoint" class="spmdInput" type="text" spellcheck="false" placeholder="https://api.example.com/v1"></span>
        </div>
        <div class="spmdRow">
          <span class="spmdLabel"><img src="assets/ui/text/mgr_apikey.png" alt="API 密钥"></span>
          <span class="spmdField"><span class="spmdFieldBg"></span><input id="spmdKey" class="spmdInput" type="password" spellcheck="false" placeholder="sk-..."></span>
        </div>
        <div class="spmdRow">
          <span class="spmdLabel"><img src="assets/ui/text/mgr_model.png" alt="模型名称"></span>
          <span class="spmdField spmdFieldPlain"><span id="spmdModel">—</span></span>
        </div>
        <div class="spmdStatus" id="spmdStatus"></div>
        <div class="spmdBtns">
          <button class="spmdBtn" type="button" data-act="switch"><img src="assets/ui/text/mgr_conn_switch.png" alt="切换连接"></button>
          <button class="spmdBtn" type="button" data-act="disconnect"><img src="assets/ui/text/mgr_conn_off.png" alt="断开连接"></button>
          <button class="spmdBtn" type="button" data-act="connect"><img src="assets/ui/text/mgr_connect.png" alt="连接"></button>
        </div>
        <button id="spmdClose" class="spmdClose" type="button" title="关闭">×</button>
      </div>
    </div>
    <div class="uiFoot"><img src="assets/ui/sys_09000.png" alt=""></div>
    <div class="uiExit" role="button" title="返回"><img class="s1" src="assets/ui/save/exit_0.png" alt=""><img class="s2" src="assets/ui/save/exit_1.png" alt=""><img class="s3" src="assets/ui/save/exit_2.png" alt=""></div>
  </div>

  <!-- ===== 回想 ===== -->
  <div id="blogScreen" class="uiScreen">
    <div class="uiHead"><img src="assets/ui/sys_00032.png" alt=""></div>
    <img class="uiLogo" src="assets/ui_logo.png" alt="">
    <div class="blogWrap" id="blogList"></div>
    <div class="blogBar"><div class="knob"></div></div>
    <div class="uiFoot"><img src="assets/ui/sys_09000.png" alt=""></div>
    <div class="uiExit" role="button" title="返回"><img class="s1" src="assets/ui/save/exit_0.png" alt=""><img class="s2" src="assets/ui/save/exit_1.png" alt=""><img class="s3" src="assets/ui/save/exit_2.png" alt=""></div>
  </div>

  <!-- ===== 记忆书：常驻设定（只读）+ 自动摘要条目（可删） =====
       文字走原生 DOM（和回想一样），不用字模：条目是动态长句，字模换行会压扁。 -->
  <div id="memScreen" class="uiScreen">
    <div class="memWrap">
      <div class="memTitle" data-no-uitext="1">记忆书</div>
      <div class="memStanding" id="memStanding" data-no-uitext="1"></div>
      <div class="memList" id="memList" data-no-uitext="1"></div>
      <div class="memHint" id="memHint" data-no-uitext="1"></div>
    </div>
    <div class="uiFoot"><img src="assets/ui/sys_09000.png" alt=""></div>
    <div class="uiExit" role="button" title="返回"><img class="s1" src="assets/ui/save/exit_0.png" alt=""><img class="s2" src="assets/ui/save/exit_1.png" alt=""><img class="s3" src="assets/ui/save/exit_2.png" alt=""></div>
  </div>



<!-- ================= 场景 / 服装手动选择 ================= -->


<!-- ================= 对话画面 ================= -->
<div id="gameScreen" class="screen">
  <!-- 场景背景双缓冲：#bgLayer 常驻当前图，#bgLayer2 只在交叉淡化时淡入 -->
  <div id="bgLayer"></div>
  <div id="bgLayer2"></div>
  <div id="lightLayer"></div>
  <div id="snowLayer"></div>

  <div id="spriteWrap">
    <img id="sprite" src="assets/kaz_cold.png" alt="">
  </div>

  <div id="historyPanel">
    <div id="historyHead"><img src="assets/ui/history/topbar.png" alt=""></div>
    <div id="historyBox">
      <div id="historyBody">
        <div id="historyList"></div>
      </div>
    </div>
    <div id="historyScroll">
      <button class="hsArrow up" data-dir="-1"><img class="off" src="assets/ui/history/arrow_up_off.png" alt=""><img class="on" src="assets/ui/history/arrow_up_on.png" alt=""></button>
      <div id="hsTrack"><img class="hsTrackImg" src="assets/ui/history/track.png" alt=""><div id="hsThumb"><img src="assets/ui/history/thumb.png" alt=""></div></div>
      <button class="hsArrow down" data-dir="1"><img class="off" src="assets/ui/history/arrow_down_off.png" alt=""><img class="on" src="assets/ui/history/arrow_down_on.png" alt=""></button>
    </div>
    <div id="historyFoot"><img src="assets/ui/history/bottombar.png" alt=""></div>
    <button id="historyExit"><img class="off" src="assets/ui/history/exit_off.png" alt=""><img class="on" src="assets/ui/history/exit_on.png" alt=""></button>
  </div>
